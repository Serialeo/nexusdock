name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4

      - name: Configure private Go module access
        uses: ./.github/actions/setup-private-go
        with:
          token: ${{ secrets.PRIVATE_GO_READ_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate, test and build
        run: make ci

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Build production image
        env:
          PRIVATE_GO_READ_TOKEN: ${{ secrets.PRIVATE_GO_READ_TOKEN }}
        run: docker build --secret id=github_token,env=PRIVATE_GO_READ_TOKEN --tag nexusdock:ci .
